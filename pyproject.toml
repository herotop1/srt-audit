[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "srt-audit"
version = "0.1.0"
description = "Zero-dependency CLI to validate SubRip subtitle files"
readme = "README.md"
requires-python = ">=3.9"
license = "MIT"
keywords = ["srt", "subtitles", "validator", "cli"]
authors = [{name = "Open-source contributors"}]
classifiers = ["Programming Language :: Python :: 3", "License :: OSI Approved :: MIT License"]

[project.scripts]
srt-audit = "srt_audit.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
